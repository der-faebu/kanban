services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kanban
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=kanban;Username=postgres;Password=postgres"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Local/dev stack: matches the plain postgres/postgres credentials above and
      # appsettings.Development.json's dev-only JWT key -- not for production use.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=kanban;Username=postgres;Password=postgres"
      Attachments__StorageRoot: /app/uploads
    ports:
      - "5138:8080"
    volumes:
      - uploads:/app/uploads
      # Without this, ASP.NET Core generates fresh Data Protection keys on every
      # container start, silently invalidating login cookies/antiforgery tokens.
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys

volumes:
  postgres_data:
  # Card attachments (Attachments:StorageRoot), mounted on the app service above so
  # they survive container restarts/redeploys.
  uploads:
  dataprotection-keys:
