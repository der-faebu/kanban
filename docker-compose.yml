version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kanban
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  # Reserved for card attachments (Attachments:StorageRoot). The app itself isn't
  # containerized yet (it runs via `dotnet run` against this compose file's postgres
  # service) -- once it is, mount this as `uploads:/app/uploads` on that service and
  # point Attachments:StorageRoot at /app/uploads so attachments survive restarts/redeploys.
  uploads:
